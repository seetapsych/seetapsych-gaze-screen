module:
  uid: 649b5d23-cf79-4c19-af03-3fb66da1eb4b
  name: OpenGaze
  version: '1.0'
  description: 'Open-source gaze estimation toolkit providing screen gaze coordinates from facial landmarks or mesh.'
  keywords:
    - Face
    - Gaze
    - Screen Gaze
  requirements:
    - seetapsych-gaze-screen
    - mmengine>=0.10.7
    - opencv-python>=4.11.0.86
    - pillow>=12.2.0
    - safetensors>=0.7.0
    - timm>=1.0.26
    - torch>=2.9.1
    - torchvision>=0.24.1
    - scipy>=1.15.3
    - mediapipe>=0.10.33
  refs:
    - name: open-gaze-estimation
      repo: https://github.com/Elorfiniel/open-gaze-estimation-2025-release
packages:
  - uid: ee7b0a24-c4b3-470d-b095-9c606384d06e
    name: GazeScreen-AFFNet(OpenGaze)
    description: Estimate screen gaze coordinates via AFFNet attention fusion network; outputs one shared gaze vector applied to both eyes. Suitable for single-user desktop scenarios with medium accuracy and compute cost.
    version: '1.0'
    priority: 30
    usage_models: []
    inputs: []
    provides:
      - face/gaze_screen
    requires:
      - face/mesh
    entry:
      method: seetapsych_gaze_screen.opengaze.affnet.package.load
    parameters:
      - name: data
        type: object
        value:
          pre_process:
            adjust_size: [480, 640]
            norm_mean: [0.485, 0.456, 0.406]
            norm_std: [0.229, 0.224, 0.225]
          post_process:
            disp_margin: 80
          camera:
            capture_id: 0
            frame_h: 720
            frame_w: 1280
            screen_x_mm: -155
            screen_y_mm: -5
          screen:
            h_px: 1080
            w_px: 1920
            h_mm: 174
            w_mm: 310
        text: Camera, Screen and Pre-processing Settings
        description: Camera/screen calibration and image preprocessing settings. camera and screen physical dimensions (mm/px) and sensor frame size must match the real setup for accurate gaze projection; adjust_size resizes input for throughput, larger increases accuracy but slows inference.
    models:
      - uid: 8b71a543-c977-47ec-8b20-6a8905d547b7
